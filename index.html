<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yoga Infinity Flow Matrix</title>
    
    <meta name="description" content="Yoga Infinity Flow Matrix - An interactive digital universe exploring 84 foundational asanas, a 908 master chart edition, and thousands of style variations.">
    <meta name="keywords" content="yoga matrix, infinite yoga flow, foundational asanas, yoga postures database, master chart yoga, ashtanga, samadhi">
    <meta name="author" content="Kaitlynn Carlson">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-deep: #05030a;
            --card-bg: rgba(18, 12, 38, 0.65);
            --border-glow: rgba(168, 85, 247, 0.35);
            --text-main: #f3f0ff;
            --accent-purple: #a855f7;
            --accent-blue: #38bdf8;
            --accent-gold: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        /* Animated Starfield Canvas */
        #starfield {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
            background: radial-gradient(ellipse at center, #180b33 0%, #05030a 100%);
        }

        /* Main Matrix Frame Box */
        .matrix-frame {
            width: 100%;
            max-width: 950px;
            background: rgba(10, 6, 22, 0.75);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(168, 85, 247, 0.4);
            border-radius: 24px;
            padding: 2.5rem 2rem;
            box-shadow: 0 0 50px rgba(126, 34, 206, 0.25), inset 0 0 30px rgba(168, 85, 247, 0.1);
            margin-bottom: 30px;
        }

        #header-container {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-size: 2.6rem;
            font-weight: 900;
            letter-spacing: 4px;
            background: linear-gradient(90deg, #d8b4fe, #818cf8, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(168, 85, 247, 0.6);
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        #subtitle {
            color: var(--accent-blue);
            font-size: 0.85rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 600;
        }

        /* Matrix 3-Column Layout */
        .matrix-layout {
            display: grid;
            grid-template-columns: 1fr 220px 1fr;
            gap: 1.5rem;
            align-items: center;
            margin-bottom: 2rem;
        }

        @media (max-width: 850px) {
            .matrix-layout {
                grid-template-columns: 1fr;
            }
        }

        .stats-col, .actions-col {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .metric-card {
            background: var(--card-bg);
            border: 1px solid var(--border-glow);
            border-radius: 18px;
            padding: 1.2rem;
            text-align: center;
            transition: all 0.4s ease;
            backdrop-filter: blur(12px);
            cursor: pointer;
        }

        .metric-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-purple);
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.4);
        }

        .metric-number {
            width: 65px;
            height: 65px;
            margin: 0 auto 0.6rem;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: 800;
            color: #fff;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.9) 0%, rgba(88, 28, 135, 0.4) 100%);
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.8);
        }

        .metric-number.blue {
            background: radial-gradient(circle, rgba(56, 189, 248, 0.9) 0%, rgba(30, 58, 138, 0.4) 100%);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.8);
        }

        .gold-sun {
            width: 65px;
            height: 65px;
            margin: 0 auto 0.6rem;
            border-radius: 50%;
            background: radial-gradient(circle, #f59e0b 0%, #b45309 70%, transparent 100%);
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.7);
        }

        .purple-vortex {
            width: 65px;
            height: 65px;
            margin: 0 auto 0.6rem;
            border-radius: 50%;
            background: radial-gradient(circle, #c084fc 0%, #581c87 70%, transparent 100%);
            box-shadow: 0 0 20px rgba(192, 132, 252, 0.7);
        }

        .metric-label {
            font-size: 0.75rem;
            letter-spacing: 1.5px;
            color: #d8b4fe;
            text-transform: uppercase;
            font-weight: 700;
        }

        /* Central Meditating Figure Silhouette */
        .center-figure {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .meditating-svg {
            width: 190px;
            height: 230px;
            filter: drop-shadow(0 0 25px rgba(56, 189, 248, 0.85));
            animation: pulseGlow 4s infinite alternate ease-in-out;
        }

        @keyframes pulseGlow {
            0% {
                filter: drop-shadow(0 0 15px rgba(168, 85, 247, 0.6));
                transform: scale(0.97);
            }
            100% {
                filter: drop-shadow(0 0 35px rgba(56, 189, 248, 0.95));
                transform: scale(1.03);
            }
        }

        /* Control Panel */
        #control-panel {
            background: rgba(18, 12, 38, 0.65);
            border: 1px solid var(--border-glow);
            border-radius: 16px;
            padding: 25px;
            width: 100%;
            max-width: 950px;
            text-align: center;
            margin-bottom: 30px;
            backdrop-filter: blur(12px);
        }

        .panel-title {
            color: #f7e7ad;
            font-size: 1rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        .interface-row {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .input-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            width: 100%;
        }

        select {
            background-color: rgba(28, 25, 24, 0.8);
            color: #ffffff;
            border: 1px solid var(--border-glow);
            padding: 12px 20px;
            font-size: 0.95rem;
            border-radius: 8px;
            width: 380px;
            font-family: inherit;
        }

        button {
            background: linear-gradient(135deg, #cc721b, #e58324);
            color: #000000;
            border: none;
            padding: 12px 24px;
            font-size: 0.95rem;
            font-weight: bold;
            letter-spacing: 1px;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s;
            width: 100%;
            max-width: 500px;
        }

        button:hover {
            box-shadow: 0 0 20px rgba(229, 131, 36, 0.6);
            transform: scale(1.02);
        }

        .star-btn {
            background: linear-gradient(135deg, #3b82f6, #6366f1);
            color: #ffffff;
            border: 1px solid #6366f1;
        }

        .star-btn:hover {
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.7);
        }

        .exit-btn {
            background: linear-gradient(135deg, #7e22ce, #a855f7);
            color: #ffffff;
            border: 1px solid #a855f7;
        }

        .exit-btn:hover {
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.7);
        }

        /* Display Panel */
        #display-panel {
            background: rgba(15, 10, 30, 0.85);
            border: 1px solid rgba(168, 85, 247, 0.35);
            border-radius: 16px;
            padding: 30px;
            width: 100%;
            max-width: 950px;
            text-align: center;
            margin-bottom: 30px;
            backdrop-filter: blur(12px);
        }

        #tier-badge {
            color: var(--accent-gold);
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        #pose-title {
            font-family: 'Cinzel', serif;
            font-size: 2rem;
            color: #ffffff;
            margin-bottom: 15px;
        }

        #pose-description {
            color: #c4b5fd;
            font-size: 1rem;
            line-height: 1.6;
            max-width: 700px;
            margin: 0 auto;
        }

        /* Gallery Grid */
        #tier-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 950px;
        }

        .gallery-card {
            background: rgba(18, 12, 38, 0.65);
            border: 1px solid var(--border-glow);
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .gallery-card:hover {
            border-color: var(--accent-blue);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
        }
    </style>
</head>

        <div id="header-container">
            <h1>Yoga Infinity Flow</h1>
            <div id="subtitle">Infinite Cosmic Expansion Matrix</div>
