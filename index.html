<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yoga Infinity Flow Matrix</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-deep: #05030a;
      --card-bg: rgba(18, 12, 38, 0.65);
      --border-glow: rgba(168, 85, 247, 0.35);
      --text-main: #f3f0ff;
      --accent-purple: #a855f7;
      --accent-blue: #38bdf8;
      --accent-gold: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-deep);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem 1rem;
    }

    /* Starfield Background */
    #starfield {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      pointer-events: none;
      background: radial-gradient(ellipse at center, #180b33 0%, #05030a 100%);
    }

    /* Matrix Frame */
    .matrix-frame {
      width: 100%;
      max-width: 1100px;
      background: rgba(10, 6, 22, 0.75);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(168, 85, 247, 0.4);
      border-radius: 24px;
      padding: 2.5rem 2rem;
      box-shadow: 0 0 50px rgba(126, 34, 206, 0.25), inset 0 0 30px rgba(168, 85, 247, 0.1);
      position: relative;
    }

    /* Header */
    .header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .header h1 {
      font-family: 'Cinzel', serif;
      font-size: 2.6rem;
      font-weight: 900;
      letter-spacing: 4px;
      background: linear-gradient(90deg, #d8b4fe, #818cf8, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 30px rgba(168, 85, 247, 0.6);
      margin-bottom: 0.4rem;
    }

    .header p {
      font-size: 0.85rem;
      letter-spacing: 3px;
      color: var(--accent-blue);
      text-transform: uppercase;
      font-weight: 600;
    }

    /* 3-Column Layout */
    .matrix-layout {
      display: grid;
      grid-template-columns: 1fr 220px 1fr;
      gap: 1.5rem;
      align-items: center;
      margin-bottom: 2rem;
    }

    @media (max-width: 850px) {
      .matrix-layout {
        grid-template-columns: 1fr;
      }
    }

    .stats-col, .actions-col {
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    .card-item {
      background: var(--card-bg);
      border: 1px solid var(--border-glow);
      border-radius: 18px;
      padding: 1.2rem;
      text-align: center;
      transition: all 0.4s ease;
      backdrop-filter: blur(12px);
    }

    .card-item:hover {
      transform: translateY(-4px);
      border-color: var(--accent-purple);
      box-shadow: 0 0 25px rgba(168, 85, 247, 0.4);
    }

    .orb {
      width: 65px;
      height: 65px;
      margin: 0 auto 0.6rem;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      font-weight: 800;
      color: #fff;
    }

    .orb-purple {
      background: radial-gradient(circle, rgba(168, 85, 247, 0.9) 0%, rgba(88, 28, 135, 0.4) 100%);
      box-shadow: 0 0 20px rgba(168, 85, 247, 0.8);
    }

    .orb-blue {
      background: radial-gradient(circle, rgba(56, 189, 248, 0.9) 0%, rgba(30, 58, 138, 0.4) 100%);
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.8);
    }

    .gold-sun {
      background: radial-gradient(circle, #f59e0b 0%, #b45309 70%, transparent 100%);
      box-shadow: 0 0 20px rgba(245, 158, 11, 0.7);
    }

    .purple-vortex {
      background: radial-gradient(circle, #c084fc 0%, #581c87 70%, transparent 100%);
      box-shadow: 0 0 20px rgba(192, 132, 252, 0.7);
    }

    .label {
      font-size: 0.75rem;
      letter-spacing: 1.5px;
      color: #d8b4fe;
      text-transform: uppercase;
      font-weight: 700;
    }

    /* Central Meditating Figure */
    .center-figure {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .meditating-svg {
      width: 190px;
      height: 230px;
      filter: drop-shadow(0 0 25px rgba(56, 189, 248, 0.85));
      animation: pulseGlow 4s infinite alternate ease-in-out;
    }

    @keyframes pulseGlow {
      0% {
        filter: drop-shadow(0 0 15px rgba(168, 85, 247, 0.6));
        transform: scale(0.97);
      }
      100% {
        filter: drop-shadow(0 0 35px rgba(56, 189, 248, 0.95));
        transform: scale(1.03);
      }
    }

    /* Pose Display Panel */
    .pose-display {
      background: rgba(15, 10, 30, 0.85);
      border: 1px solid rgba(168, 85, 247, 0.35);
      border-radius: 16px;
      padding: 1.8rem;
      text-align: center;
    }

    .pose-tier {
      font-size: 0.75rem;
      letter-spacing: 2px;
      color: var(--accent-gold);
      text-transform: uppercase;
      margin-bottom: 0.4rem;
    }

    .pose-title {
      font-family: 'Cinzel', serif;
      font-size: 1.7rem;
      color: #ffffff;
      margin-bottom: 0.6rem;
    }

    .pose-desc {
      color: #c4b5fd;
      font-size: 0.9rem;
      max-width: 650px;
      margin: 0 auto;
      line-height: 1.5;
    }
  </style>
</head>

        <div class="card-item">
          <div class="orb orb-blue">908</div>
          <div class="label">Master Chart</div>
        </div>
        <div class="card-item">
          <div class="orb orb-purple">8,000</div>
          <div class="label">Variations Matrix</div>
        </div>
      </div>

      <div class="center-figure">
